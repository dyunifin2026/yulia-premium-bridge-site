name: Deploy to Beget (Russian hosting)

# Запускается автоматически при каждом обновлении кода в ветке main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Устанавливаем pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # 4. Устанавливаем зависимости
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Собираем production-версию сайта
      - name: Build site
        run: pnpm build

      # 6. Загружаем собранные файлы на Beget по FTP
      - name: Deploy to Beget via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # FTP-данные берутся из секретов GitHub (настраиваются один раз)
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASS }}
          # Папка с собранным сайтом
          local-dir: ./dist/public/
          # Папка на хостинге (обычно public_html или имя домена)
          server-dir: ${{ secrets.BEGET_FTP_DIR }}
          # Удалять файлы на сервере, которых нет в сборке
          dangerous-clean-slate: false
          # Исключаем служебные файлы Manus
          exclude: |
            **/__manus__/**
            **/.gitkeep
